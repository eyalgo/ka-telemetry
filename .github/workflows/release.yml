name: release

# Publishes to PyPI when a version tag such as v0.1.0 is pushed. PyPI trusts this workflow
# (trusted publishing), so no token is stored anywhere.
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    # Runs only in the public repository, not in the private ka-telemetry-dev it is cut from.
    if: github.repository == 'eyalgo/ka-telemetry'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1

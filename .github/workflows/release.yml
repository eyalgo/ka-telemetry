name: release

# Publishes to PyPI when a version tag such as v0.1.0 is pushed. PyPI trusts this workflow
# (trusted publishing), so no token is stored anywhere. Nothing is published unless the tests and
# the release check both pass on the exact commit the tag names, and the package is built from
# that same commit.
on:
  push:
    tags: ["v*"]

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  release-check:
    # Runs only in the public repository, not in the private ka-telemetry-dev it is cut from.
    if: github.repository == 'eyalgo/ka-telemetry'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: The tag names the version pyproject.toml declares
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, pyproject.toml $version"; exit 1; }
      - run: python -m pip install pytest
      - run: python tools/release_check.py

  publish:
    needs: [tests, release-check]
    if: github.repository == 'eyalgo/ka-telemetry'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1

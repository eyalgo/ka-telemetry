name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Runs only in the public repository, not in the private ka-telemetry-dev it is cut from.
    if: github.repository == 'eyalgo/ka-telemetry'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - run: python -m pytest -q tests
